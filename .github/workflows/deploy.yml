name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            gladiator-arena-modern/package-lock.json
            arena_grid_markup/package-lock.json

      - name: Build game
        working-directory: gladiator-arena-modern
        run: |
          npm ci
          npm run build -- --base=/gladiators/

      - name: Build arena markup tool
        working-directory: arena_grid_markup
        run: |
          npm ci
          npm run build -- --base=/gladiators/markup/

      - name: Assemble site
        run: |
          mkdir -p site/markup
          cp -r gladiator-arena-modern/dist/. site/
          cp -r arena_grid_markup/dist/. site/markup/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
